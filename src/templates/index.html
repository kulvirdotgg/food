<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Food</title>
        <meta name="description" content="AI powered food recommendations." />
        <meta name="robots" content="index, follow" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Food Recommender" />
        <meta property="og:description" content="AI powered food recommendations." />
        <link rel="stylesheet" href="./index.css" />
        <script type="module" src="./htmx.ts"></script>
        <script>
            function showSkeleton() {
                const toggle = () => {
                    landing.classList.add("hidden")
                    skeleton.classList.remove("hidden")
                }
                document.startViewTransition ? document.startViewTransition(toggle) : toggle()
            }
        </script>
    </head>
    <body class="min-h-screen overflow-x-hidden antialiased">
        <!-- radial gradients: soft orange cricles creating glow effect -->
        <div
            aria-hidden="true"
            class="pointer-events-none fixed inset-0 bg-[radial-gradient(circle_at_top_left,rgba(198,85,32,0.18),transparent_30%),radial-gradient(circle_at_bottom_right,rgba(201,111,45,0.12),transparent_24%)]"
        ></div>

        <main class="grid min-h-screen place-items-center px-4 py-8 sm:px-6 lg:px-8">
            <section aria-label="Food recommendation terminal" class="w-full max-w-5xl border bg-card p-2 sm:p-3">
                <div class="z-20 border bg-background/90 p-3 sm:p-4">
                    <div
                        class="flex flex-wrap items-center justify-between gap-2 border-b pb-1 text-xs uppercase tracking-widest text-muted-foreground"
                    >
                        <p>food://terminal</p>
                        <p>state: ready</p>
                    </div>

                    <div id="content" class="pt-6">
                        <!-- landing page state - generate recommendations button -->
                        <div id="landing" class="grid gap-3 justify-items-center text-center">
                            <h1
                                class="w-full max-w-2xl text-balance text-3xl leading-tight font-semibold uppercase tracking-widest sm:text-5xl"
                            >
                                queue up your next meal.
                            </h1>
                            <button
                                type="button"
                                aria-label="Generate food recommendations"
                                hx-post="/api/recommend"
                                hx-target="#content"
                                hx-swap="innerHTML transition:true"
                                hx-on::before-request="showSkeleton()"
                                class="border border-primary px-4 py-2.5 bg-primary text-sm font-semibold uppercase text-primary-foreground tracking-widest transition-all duration-200 hover:-translate-x-0.5 hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-ring/20"
                            >
                                [ Generate Recommendations ]
                            </button>
                        </div>

                        <!-- loading skeleton state - shown while /api/recommend is in flight -->
                        <div
                            id="skeleton"
                            role="status"
                            aria-live="polite"
                            aria-label="Loading food recommendations"
                            class="hidden grid gap-6 justify-items-center text-center"
                        >
                            <p class="text-xs font-semibold uppercase tracking-widest text-accent">
                                [ scanning pantry ]
                            </p>
                            <div
                                aria-hidden="true"
                                class="grid w-full max-w-6xl grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 lg:gap-4"
                            >
                                <div class="grid content-start gap-3 border bg-card/60 px-4 py-4 sm:px-5 col-span-1">
                                    <div class="h-4 w-1/2 animate-pulse bg-muted"></div>
                                    <div class="h-3 w-2/3 animate-pulse bg-muted"></div>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="h-5 w-16 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-20 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-14 animate-pulse bg-muted"></span>
                                    </div>
                                </div>
                                <div class="grid content-start gap-3 border bg-card/60 px-4 py-4 sm:px-5 col-span-1">
                                    <div class="h-4 w-1/2 animate-pulse bg-muted"></div>
                                    <div class="h-3 w-2/3 animate-pulse bg-muted"></div>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="h-5 w-16 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-20 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-14 animate-pulse bg-muted"></span>
                                    </div>
                                </div>
                                <div class="grid content-start gap-3 border bg-card/60 px-4 py-4 sm:px-5 col-span-1">
                                    <div class="h-4 w-1/2 animate-pulse bg-muted"></div>
                                    <div class="h-3 w-2/3 animate-pulse bg-muted"></div>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="h-5 w-16 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-20 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-14 animate-pulse bg-muted"></span>
                                    </div>
                                </div>
                                <div class="grid content-start gap-3 border bg-card/60 px-4 py-4 sm:px-5 col-span-1">
                                    <div class="h-4 w-1/2 animate-pulse bg-muted"></div>
                                    <div class="h-3 w-2/3 animate-pulse bg-muted"></div>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="h-5 w-16 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-20 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-14 animate-pulse bg-muted"></span>
                                    </div>
                                </div>
                                <div class="grid content-start gap-3 border bg-card/60 px-4 py-4 sm:px-5 col-span-1">
                                    <div class="h-4 w-1/2 animate-pulse bg-muted"></div>
                                    <div class="h-3 w-2/3 animate-pulse bg-muted"></div>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="h-5 w-16 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-20 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-14 animate-pulse bg-muted"></span>
                                    </div>
                                </div>
                                <div class="grid content-start gap-3 border bg-card/60 px-4 py-4 sm:px-5 col-span-1">
                                    <div class="h-4 w-1/2 animate-pulse bg-muted"></div>
                                    <div class="h-3 w-2/3 animate-pulse bg-muted"></div>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="h-5 w-16 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-20 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-14 animate-pulse bg-muted"></span>
                                    </div>
                                </div>
                                <div class="grid content-start gap-3 border bg-card/60 px-4 py-4 sm:px-5 col-span-1">
                                    <div class="h-4 w-1/2 animate-pulse bg-muted"></div>
                                    <div class="h-3 w-2/3 animate-pulse bg-muted"></div>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="h-5 w-16 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-20 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-14 animate-pulse bg-muted"></span>
                                    </div>
                                </div>
                                <div class="grid content-start gap-3 border bg-card/60 px-4 py-4 sm:px-5 col-span-1">
                                    <div class="h-4 w-1/2 animate-pulse bg-muted"></div>
                                    <div class="h-3 w-2/3 animate-pulse bg-muted"></div>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="h-5 w-16 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-20 animate-pulse bg-muted"></span>
                                        <span class="h-5 w-14 animate-pulse bg-muted"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
